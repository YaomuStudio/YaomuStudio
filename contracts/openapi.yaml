        基于 base_revision_id 做乐观并发，保存稳定片段 ID 与内容；冲突返回 409 REVISION_CONFLICT，
        不覆盖新版本。content_revision 与 content_digest 由 Core 计算，客户端不提交。
      parameters:
        - name: id
          in: path
