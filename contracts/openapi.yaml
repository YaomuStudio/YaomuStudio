          application/json:
            schema:
              $ref: "#/components/schemas/CreateCandidatesRequest"
      responses:
        "202":
          description: 重抽已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentCandidateJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
