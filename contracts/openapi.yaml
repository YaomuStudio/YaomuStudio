openapi: 3.0.3
info:
  title: 曜幕内部本地 API
  version: 0.2.1
  description: |
    曜幕（YaoMu Studio）本地 App Server 的结构契约。语义权威是 docs/local-api-contract.md，
    领域模型以 docs/data-and-storage.md 为准，状态机以 docs/initialization-and-task-lifecycle.md
    与 docs/workflow-and-review.md 为准。本文件只把已有语义落成结构，不新增文档之外的端点或字段。

    约定：
    - 业务路径统一以 /api/v1 为前缀；只有 /health/live 返回不含机器信息的最小存活响应。
    - Core 完成业务准备（迁移、任务/文件恢复）后才监听业务 API；Runner hello 异步进行。
      /health/live 只表示进程存活，core_ready=true 表示 Core 业务准备完成，均不代表模型或执行器就绪。
    - 线上字段使用 snake_case；UI/TypeScript 侧使用驼峰并在桥接层转换，不做双写。
    - ID 为不透明字符串；时间使用 UTC ISO 8601；媒体时间用整数毫秒；大小用字节。
    - 内部 API 须携带 Shell 私有通道注入的实例令牌，并校验 Host/Origin；随机端口和 CORS 不能代替授权。
    - 状态变更请求携带 Idempotency-Key 与 request_id；只读评估型 POST（preflight/plan）只需 request_id。
      幂等范围为工作区 + 操作 + key：同一摘要返回原回执，不同摘要返回 409 IDEMPOTENCY_CONFLICT。
    - 错误响应统一为 {request_id, error:{code, message_key, retryable, action_ids}}，原始输出只进
      有上限、脱敏的本地诊断，不通过网络返回。
    - 第三方本机 API 是独立回环端口，默认关闭；开启后单独监听 127.0.0.1 并要求可吊销的 Bearer 令牌。
    - Core/Runner 执行器协议只在本文件的 x-execution-protocol 中保留帧类型摘要，不定义 FlashCLI 参数，
      也不定义六槽位 bundle 内容契约。
    - 与文档的差异以 docs/local-api-contract.md 的注记为准，不静默维护第二套语义。
    - lint 说明：/health/live 按设计不返回 4XX（无鉴权、无业务错误码），Redocly 的
      operation-4xx-response 告警为预期，不以虚构的 4XX 响应消除。
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:{core_port}
    description: 内部 Shell/Core API（随机端口或私有 IPC；业务路径以 /api/v1 为前缀）
    variables:
      core_port:
        default: "0"
        description: 运行时由 Runtime Supervisor 分配，不在本文件中固定
  - url: http://127.0.0.1:{local_api_port}
    description: 第三方本机 API（独立回环端口，默认关闭；开启后才监听，Bearer 令牌可吊销）
    variables:
      local_api_port:
        default: "0"
        description: 开启第三方本机 API 时单独监听的回环端口
security:
  - instanceToken: []
tags:
  - name: health
    description: 最小存活检查
  - name: system
    description: 实例握手与启动阶段
  - name: capabilities
    description: 能力目录（六类模型槽位 + OCR/FFmpeg 辅助能力）
  - name: installations
    description: 模型/运行时安装计划、执行与已安装包管理
  - name: devices
    description: 计算设备清单（FR-SET-40）
  - name: environment
    description: 本机执行环境快照（平台、WSL2、CUDA、FFmpeg）
  - name: projects
    description: 本地项目与项目视图
  - name: assets
    description: 媒体导入与受控内容读取
  - name: workflow-runs
    description: 业务计划（八节点/专属模板）
  - name: tasks
    description: 预检、任务提交与任务快照
  - name: reviews
    description: 人工审核（ReviewGate）读取与放行
  - name: segments
    description: 句级候选与选用
  - name: subtitle-tracks
    description: 字幕轨 revision 保存
  - name: custom-pipeline
    description: 专属链路本机模板（配置持久化，不含文件）
  - name: engines
    description: 六槽位受控配置
  - name: exports
    description: 字幕/成品导出任务
  - name: storage
    description: 分区用量与逐类清理（FR-SET-42）
  - name: sync
    description: 快照与增量事件（SSE）
  - name: local-api
    description: 第三方本机 API 的总开关、令牌、并发上限与本地统计（内部 API，设置页读取）
  - name: third-party-local-api
    description: 第三方本机 OpenAI 兼容端点（独立回环端口，默认关闭）
x-execution-protocol:
  description: >-
    Core 与 Runner 之间的执行器协议摘要。只列帧类型与绑定要求，不展开字段，不猜测
    FlashCLI 的离线/JSON 等参数，也不定义六槽位 bundle 内容契约。
  transport: 版本化 JSON，建议 stdio 或私有管道；不为每个 Worker 开放 HTTP 端口
  frames:
    - hello
    - probe
    - execute
    - cancel
    - shutdown
  events:
    - heartbeat
    - progress
    - log
    - result
    - error
  log_event: >-
    Runner -> Core 的可丢弃执行过程行。payload 绑定 server_epoch/task_id/step_id/attempt，
    含 stream（stderr|stdout|runner）、应用构造且不超过 512 字符的受控摘要 line 与可选单调 seq；
    只允许完整匹配固定阶段消息或严格整数模板，模型/子进程 stdout/stderr 原文不得转发；
    不进入持久事件游标，也不作为任务成功条件。
  binding: >-
    执行请求必须绑定协议版本、workspace、server epoch、task/step ID、单调 attempt 编号、
    模型/适配器/运行时摘要、参数、输入资产 ID 和专属输出目录。
  constraints:
    - Task.Params._core 仅 Core 持久化，包含冻结执行与输出基线，不发送给 Runner。
    - 08/导出向 FFmpeg 传冻结 plan 白名单；所有成果先准备、再随任务终态事务登记和发布成功。
    - 所有任务共享执行器声明的并发容量；未确认旧执行退出时隔离且不派新任务。
    - 内部文件路径由 Main 按应用顶层 IPC 来源和窗口授权校验后转发；Renderer 不能构造授权。
    - Core 先持久化运行状态再派发；只接受当前 epoch/attempt 的结果。
    - stdout 只写有大小限制的协议帧，日志走 stderr。
    - 取消超时后只终止本应用拥有的进程树；未确认退出前不把资源槽交给第二个任务。
    - 心跳丢失不能直接证明进程已死，必须核对拥有者、进程身份与执行侧状态。
paths:
  /health/live:
    get:
      operationId: getHealthLive
      tags: [health]
      summary: 最小存活检查
      description: 返回不含机器信息的最小存活响应，不要求实例令牌；只说明进程存活，不代表 Core 业务就绪，更不代表 Runner/模型可执行。慢 Runner 握手不阻塞本端点。
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/system:
    get:
      operationId: getSystem
      tags: [system]
      summary: 实例握手与启动阶段
      description: 返回应用标识、协议版本、instance/workspace ID、server epoch 与 Core 是否就绪。
      responses:
        "200":
          description: 实例信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/system/update-preparation:
    post:
      operationId: prepareApplicationUpdate
      tags: [system]
      summary: 应用更新前同实例原子准备
      description: >-
        仅Main经私有认证连接调用，不暴露给Renderer通用代理或第三方端口。
        有活动业务/执行或在飞普通请求时返回blocked，不暂停/取消/改队列。
        空闲时原子封住普通请求与业务写，确认调度器及Runner清理后才prepared；
        开始不可逆清理后失败保持封闸，需重启，不用TTL自动解封。详app-update-installation.md。
        使用实例内operation_id，不保存跨重启幂等回执；prepared不等于安装已执行。
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreparationRequest"
      responses:
        "200":
          description: 当前同实例准备结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePreparationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/capabilities:
    get:
      operationId: listCapabilities
      tags: [capabilities]
      summary: 能力目录
      description: >-
        逐槽位返回支持范围、安装/运行状态、原因码、修复动作与受控参数 Schema。发布准入决定可见性，
        本机状态决定可运行性；OCR 为辅助依赖，FFmpeg 为媒体工具能力。
      responses:
        "200":
          description: 能力目录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/installations/plan:
    post:
      operationId: planInstallation
      tags: [installations]
      summary: 解析安装计划
      description: >-
        解析到一组精确发布版本与摘要，返回下载/缓存复用/安装量、峰值暂存、所需权限、许可与计划哈希；
        计划绑定用户同意的范围，执行时不能扩大。
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationPlanRequest"
      responses:
        "200":
          description: 安装计划
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallationPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/installations:
    get:
      operationId: listInstallations
      tags: [installations]
      summary: 安装记录列表
      description: >-
        返回当前工作区的安装/已安装包记录（含阶段与进度），供模型页、引导页与更新页读取；
        不含本机绝对路径。已完成的记录用于按槽位删除或回滚上一保留版本（FR-MODEL-02）。
      responses:
        "200":
          description: 安装记录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Installation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createInstallation
      tags: [installations]
      summary: 执行用户同意的安装计划
      description: >-
        绑定计划哈希、covered_slots与幂等键；旧未冻结覆盖的计划须重新plan。
        同一精确发布并发请求加入同一安装ID；已验证实体可复用，不生成伪Done记录或重复下载。
        计划过期/复用目标失效/范围变化返回409 PREFLIGHT_STALE；不能扩大已同意范围，详shared-installations.md。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstallationRequest"
      responses:
        "202":
          description: 安装已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/installations/{id}:
    get:
      operationId: getInstallation
      tags: [installations]
      summary: 安装/恢复状态
      description: 返回阶段、真实进度、已验证文件、错误与可重试标志；重启后以实际状态为准，不只信完成标记。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 安装状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/installations/{id}/cancel:
    post:
      operationId: cancelInstallation
      tags: [installations]
      summary: 取消安装
      description: 请求停止该物理安装，对其全部覆盖槽位生效；先确认写入停止再清理临时文件，保留旧当前版本。202只代表受理，worker尾部仍占有文件。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "202":
          description: 取消已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/capabilities/{slot}/installation:
    delete:
      operationId: deleteInstalledPackage
      tags: [installations]
      summary: 删除已安装包
      description: >-
        解除该槽位的当前/保留安装引用（FR-MODEL-02）；不解除其他槽位。
        仅最后有效引用移除后回收物理文件，保留项目/原件及其他槽位/保留版本的共享文件。
        活动Task、仍可推进Run的精确冻结引用或安装worker尾部存在时返回409；删除需确认。
        幂等重放不重复文件删除，详shared-installations.md。
      parameters:
        - name: slot
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CapabilitySlotKey"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/capabilities/{slot}/rollback:
    post:
      operationId: rollbackInstalledPackage
      tags: [installations]
      summary: 回滚到上一保留版本
      description: >-
        仅该槽位切到上一不同精确发布的保留引用（FR-MODEL-02），核文件后返回202与该已有安装实体；
        不复制Done记录，不改变其他槽位或冻结任务的锁。相关活动工作未排空时不切换，
        无可验证的保留版本返回409。旧客户端仍收到Installation形状，写后须重读当前引用。
      parameters:
        - name: slot
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CapabilitySlotKey"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "202":
          description: 回滚已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: 计算设备清单
      description: >-
        返回可用计算设备与推荐项（FR-SET-40）；包含设备类型、内存/显存总量与当前占用、
        是否被本应用模型占用。设备选择仍通过 PUT /engines/{slot}/config 的 device_id 提交，
        切换需客户端确认并遵守活跃任务固定旧版本的规则。
      responses:
        "200":
          description: 设备清单
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/environment:
    get:
      operationId: getEnvironment
      tags: [environment]
      summary: 本机执行环境快照
      description: >-
        返回宿主平台、WSL2 状态、计算设备与只读环境检查（FR-SET-23/40）。探测失败以
        检查项表达，不伪造设备；端点不安装系统组件、不修改设置、不执行 FlashCLI。
      parameters:
        - name: refresh
          in: query
          required: false
          description: 为 true 时跳过探测缓存并立即重新检测
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 环境快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: 项目列表
      description: 返回轻量项目摘要；详细资产、字幕轨与运行状态通过项目视图读取。
      responses:
        "200":
          description: 项目摘要列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createProject
      tags: [projects]
      summary: 创建本地项目
      description: 项目属于当前工作区，不需要云账号；创建后由 Core 分配项目 ID 与编辑版本。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 项目已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: 项目视图
      description: >-
        返回项目元数据、资产、字幕轨（含 revision）与运行状态。大媒体内容仍通过资产内容端点
        以流式/Range 读取，不内联到 JSON。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 项目视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: 修改项目元数据
      description: >-
        目前只允许修改项目名称；名称去首尾空格后 1–30 个字符。
        edit_version 用于乐观并发检查，成功后编辑版本递增并发布 project.updated 事件。
      parameters:
        - name: id
