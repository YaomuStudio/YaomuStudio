      description: >-
        使用 Shell 文件选择器签发的 file grant，指定项目与引用/复制策略；不接受宿主任意路径。
        长导入返回任务 ID，进度通过任务快照或事件查询；短导入直接返回资产 ID。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetImportRequest"
      responses:
        "202":
          description: 导入已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/assets/{id}/relocate:
    post:
      operationId: relocateAsset
      tags: [assets]
      summary: 重新定位缺失的外部引用
      description: >-
        仅用于 source=external_reference 且 status=missing 的资产。新 file grant 的内容
        SHA-256 必须等于导入时记录的摘要，否则 400 且状态不变；成功后保留资产 ID、项目与
        既有轨道/任务引用，只更新位置、大小与（探测可用时）媒体元数据，并恢复 ready。
        copy/generated 资产、目录或相对路径、探测失败均返回可读错误，要求重新导入。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetRelocateRequest"
      responses:
        "200":
          description: 已重新定位
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/assets/{id}/content:
    get:
      operationId: getAssetContent
      tags: [assets]
      summary: 预览/流式读取资产内容
      description: >-
        按资产授权读取，不接受任意路径或远端 URL；支持字节 Range，用于预览与导出流式处理。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: HTTP 字节范围（bytes=start-end）
          schema:
            type: string
      responses:
        "200":
          description: 完整内容
          headers:
            Accept-Ranges:
              description: 支持字节范围读取
              schema:
                type: string
                enum: [bytes]
            Content-Type:
              description: 由资产类型决定的媒体 MIME
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 部分内容
          headers:
            Accept-Ranges:
              description: 支持字节范围读取
              schema:
                type: string
                enum: [bytes]
            Content-Range:
              description: 实际返回的字节范围
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/preflight:
    post:
      operationId: preflight
      tags: [tasks]
      summary: 评估任务/运行计划
      description: >-
        绑定输入资产/字幕 revision、参数摘要、模型/运行时摘要与兼容规则版本，返回 pass/warning/blocker、
        原因码、修复动作与计划 ID/哈希。警告确认不是全局忽略风险；暂时资源忙可排队，永久不满足为阻断。
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRunInput"
      responses:
        "200":
          description: 预检结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workflow-runs:
    post:
      operationId: createWorkflowRun
      tags: [workflow-runs]
      summary: 创建业务计划
      description: >-
        创建八节点或专属模板的业务计划容器，绑定输入 revision、源/目标语言、提取方式与素材复用语义。
        写操作先持久化计划、幂等回执与关键事件，再允许派发；预检条件变化返回 409 PREFLIGHT_STALE。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRunInput"
      responses:
        "201":
          description: 运行计划已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workflow-runs/{id}:
    get:
      operationId: getWorkflowRun
      tags: [workflow-runs]
      summary: 运行计划快照
      description: 返回运行状态、八节点状态与语言列表；每语种的审核状态通过审核列表读取。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 运行计划
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workflow-runs/{id}/pause:
    post:
      operationId: pauseWorkflowRun
      tags: [workflow-runs]
      summary: 暂停运行
      description: >-
        在安全单元边界生效：当前不可中断单元完成后显示 PAUSE_REQUESTED，资源释放后为 PAUSED。
        PAUSED 时仍可保存编辑、候选选择与审核记录，但只登记待执行工作，不派发新模型任务。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "202":
          description: 暂停已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/workflow-runs/{id}/resume:
    post:
      operationId: resumeWorkflowRun
      tags: [workflow-runs]
      summary: 恢复运行
      description: 恢复前重新预检；终止 Run 拒绝恢复，需要生产时创建新的 Run/派生版本。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "202":
          description: 恢复已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: 任务列表
      description: 分页返回任务状态、产物与错误摘要，不嵌入完整日志或进度历史。
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
        - name: run_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 next_cursor
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 任务分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createTask
      tags: [tasks]
      summary: 提交执行单元
      description: >-
        任务、步骤计划、输入锁、幂等回执与关键事件同事务提交成功后才返回 202 并派发。
        提交时重新检查预检条件，变化返回 409 PREFLIGHT_STALE；数据库失败返回错误，不派发执行器。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "202":
          description: 任务已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: 任务快照
      description: 返回状态、步骤、产物与错误；进度是可丢弃反馈，不作为恢复依据。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 任务快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags: [tasks]
      summary: 请求取消任务
      description: >-
        幂等。响应只代表取消受理，实际终态见任务快照；成功提交与取消由 Core 事务比较版本决定，
        已 SUCCEEDED 的任务不能被迟到取消改为 CANCELED。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "202":
          description: 取消已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}/retry:
    post:
      operationId: retryTask
      tags: [tasks]
      summary: 重试冻结输入的任务
      description: >-
        未完成步骤增加单调 attempt 编号；成功终态或输入改变返回冲突。重试固定原模型版本与输入，
        原版本不可用时要求安装或新建任务，不静默换模型、降 CPU 或转云。
        07 已记录的冻结时间窗越界或媒体时长未知属于原地重试无法修复的输入冲突，
        返回 409 REVISION_CONFLICT 及对应安全时间轴消息键；保留原失败、attempt 与事件不变，
        修正字幕或重新导入媒体后创建新运行，不把新输入替换进旧任务。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "202":
          description: 重试已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tasks/{id}/execution-log:
    get:
      operationId: getTaskExecutionLog
      tags: [tasks]
      summary: 读取任务执行过程日志尾部
      description: >-
        只返回应用构造的受控过程摘要（固定阶段或严格整数模板），来自本地 cache 目录；
        写入与回放使用同一正向允许策略，未知自由文本不返回；不删除或改写既有 cache 文件。
        不写入业务库，也不作为任务成功条件。文件缺失或已被缓存清理时返回空列表。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: attempt
          in: query
          required: false
          description: attempt 编号；缺省读取该任务最近一次 attempt
          schema:
            type: integer
            minimum: 1
        - name: tail
          in: query
          required: false
          description: 返回最近的行数
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: 执行过程日志尾部（可能为空）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/projects/{id}/reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: 项目审核列表
      description: 返回项目内ReviewGate与只读current_bindings；历史记录保留，可按运行过滤。当前绑定在同一读事务派生，不凭列表顺序推断。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: run_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 审核列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewGate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/reviews/{id}:
    get:
      operationId: getReview
      tags: [reviews]
      summary: 审核详情
      description: 返回单个 ReviewGate；旧审核不能自动放行新内容。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 审核详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewGate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/reviews/{id}/approve:
    post:
      operationId: approveReview
      tags: [reviews]
      summary: 人工放行
      description: >-
        绑定被请求gate的精确revision_digest与类型；不一致返回409 REVISION_CONFLICT。
        可选current_binding由新客户端提交，Core在同一事务确认它仍为该gate当前绑定，否则409且不批准。
        缺省保留旧客户端记录历史gate的语义，历史批准不代表放行新内容。
        暂停时允许登记审核结果但不派发新任务；终止Run拒绝放行。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveReviewRequest"
      responses:
        "200":
          description: 审核结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewGate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
