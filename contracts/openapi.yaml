      description: >-
        返回该句段与语言已有的不可变候选（推荐候选以 is_recommended 标记），用于逐句试听比对
        与故障恢复（FR-PIPE-04）。生成受理（202）后客户端通过本端点读回新候选，或等待任务事件；
        只返回该句段该语言的候选，不返回其他句或其他语言。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: true
          description: 候选所属语言
          schema:
            type: string
      responses:
        "200":
          description: 候选列表
          content:
            application/json:
              schema:
                type: array
