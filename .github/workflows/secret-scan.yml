name: secret-scan

on:
  # PR 不触发：公开仓只接受镜像 bot 写入，变更合入 main 时仍会扫描。
  push:
    branches: [main, master]
  # 每周全历史兜底；平时 push 只扫本次新增提交。
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan git history
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          zero="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BEFORE_SHA" = "$zero" ]; then
            echo "scanning full history"
            /tmp/gitleaks git --redact --verbose --no-banner .
            exit 0
          fi
          if ! git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA"; then
            echo "before commit is not an ancestor; scanning full history"
            /tmp/gitleaks git --redact --verbose --no-banner .
            exit 0
          fi
          echo "scanning $BEFORE_SHA..$AFTER_SHA"
          /tmp/gitleaks git --redact --verbose --no-banner --log-opts="$BEFORE_SHA..$AFTER_SHA" .
