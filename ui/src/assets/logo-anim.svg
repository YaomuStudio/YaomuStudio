<?xml version="1.0" encoding="UTF-8"?>
<svg width="152" height="140" viewBox="118 130 152 140" xmlns="http://www.w3.org/2000/svg">
  <title>yaomustudio logo animation</title>
  <defs>
    <linearGradient x1="12.78%" y1="93.99%" x2="81.33%" y2="9.49%" id="lg">
      <stop stop-color="#7246FF" offset="0%"/><stop stop-color="#4453FF" offset="15.55%"/>
      <stop stop-color="#2171FF" offset="24.16%"/><stop stop-color="#4691FF" offset="34.79%"/>
      <stop stop-color="#4B96FF" offset="55.13%"/><stop stop-color="#00FFFF" offset="100%"/>
    </linearGradient>
  </defs>
  <style>
    .anim { transform-box: fill-box; transform-origin: center; }
    /* 播放键（初始 #1677ff）：待机呼吸 → 被撞击挤压 → 消失 */
    .play-anim { animation: play 4.6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes play {
      0%,36% { transform: scale(1); opacity: 1; }
      12%    { transform: scale(1.05); }
      24%    { transform: scale(1); }
      41%    { transform: scale(1.02); }        /* 预感：微缩 */
      43%    { transform: scale(.82,.76); opacity: 1; }  /* 撞击挤压 */
      47%    { transform: scale(1.1,1.12); }
      50%    { transform: scale(1); opacity: 0; }
      100%   { opacity: 0; }
    }
    /* 星星（初始 #1677ff）：键左侧出现闪烁缩放 → 向右/右上加速冲刺 → 撞击右上缘消散 */
    .star-anim { animation: star 4.6s cubic-bezier(.5,0,.3,1) infinite; }
    @keyframes star {
      0%   { transform: translate(0,0) scale(.1) rotate(0deg); opacity: 0; }
      8%   { transform: translate(0,0) scale(1.05) rotate(20deg); opacity: 1; }
      16%  { transform: translate(0,0) scale(.92) rotate(30deg); }
      24%  { transform: translate(0,0) scale(1.18) rotate(45deg); }  /* 闪烁放大 */
      30%  { transform: translate(0,0) scale(1) rotate(45deg); }
      36%  { transform: translate(0,0) scale(1.12) rotate(60deg); }
      40%  { transform: translate(43px,-12px) scale(.85) rotate(78deg); }    /* 起冲：掠过键面 */
      41.5%{ transform: translate(95px,-38px) scale(.62) rotate(90deg); }    /* 向右上加速 */
      43%  { transform: translate(122px,-60px) scale(.3) rotate(100deg); opacity: .4; } /* 撞击右上缘 */
      46%  { transform: translate(122px,-60px) scale(.1) rotate(100deg); opacity: 0; }
      100% { opacity: 0; }
    }
    /* 终稿logo：撞击后弹性登场 → 呼吸 → 循环淡出 */
    .logo-anim { animation: logo 4.6s cubic-bezier(.34,1.56,.64,1) infinite; opacity: 0; }
    @keyframes logo {
      0%,44%  { transform: scale(.55); opacity: 0; }
      50%     { transform: scale(1.08); opacity: 1; }   /* 弹性过冲 */
      54%     { transform: scale(.98); }
      57%     { transform: scale(1); }
      70%     { transform: scale(1.035); }               /* 呼吸 */
      80%     { transform: scale(1); }
      94%     { transform: scale(1); opacity: 1; }
      100%    { transform: scale(1); opacity: 0; }       /* 循环重置 */
    }
    /* 环绕光点：小半径轨道绕行一圈 */
    .orbit { animation: orbit 4.6s linear infinite; opacity: 0; }
    @keyframes orbit {
      0%,55% { transform: rotate(0deg) translateX(62px) scale(.6); opacity: 0; }
      58%    { opacity: 1; }
      92%    { transform: rotate(300deg) translateX(62px) scale(.6); opacity: 1; }
      96%,100% { transform: rotate(360deg) translateX(62px) scale(.6); opacity: 0; }
    }
  </style>

  <!-- 播放键（初始 #1677ff 圆角三角） -->
  <g transform="translate(161,157.5)">
    <g class="anim play-anim">
      <path fill="#1677FF" d="M21.58,2.01 L70.08,30.01 C79.65,35.54 79.65,49.36 70.08,54.88 L21.58,82.88 C12.01,88.41 0.04,81.5 0.04,70.44 L0.04,14.44 C0.04,3.39 12,-3.52 21.58,2.01 Z"/>
    </g>
  </g>

  <!-- 星星（初始 #1677ff，位于播放键左侧，向右/右上冲刺） -->
  <g transform="translate(124,222) scale(.8)">
    <g class="anim star-anim">
      <path fill="#1677FF" d="M12.461757,2.42544261 C13.7121441,-0.808480869 18.2866155,-0.808480869 19.5370027,2.42544261 C21.3190984,7.03542319 24.9633364,10.6796612 29.573317,12.461757 C32.8072405,13.7121441 32.8072405,18.2866155 29.573317,19.5370027 C24.9633364,21.3190984 21.3190984,24.9633364 19.5370027,29.573317 C19.0173921,30.9186102 17.9235999,31.7039577 16.732529,31.9317322 C16.3125698,32.0100297 15.8783746,32.021893 15.4560426,31.9625767 C14.0932478,31.7821238 12.9414494,30.8639707 12.461757,29.5756896 C10.6796612,24.9657091 7.03542319,21.321471 2.42544261,19.5393753 C-0.808480869,18.2866155 -0.808480869,13.712144 2.42544261,12.461757 C7.03542319,10.6796612 10.6796612,7.03542319 12.461757,2.42544261 Z"/>
    </g>
  </g>

  <!-- 终稿logo（渐变分叉播放键+内嵌星） -->
  <g transform="translate(160.5,155.5)">
    <g class="anim logo-anim">
      <path fill="url(#lg)" fill-rule="nonzero" d="M22.58,5.01 L71.08,33.01 C75.521902,35.5754609 78.258052,40.3154697 78.258052,45.445 C78.258052,50.5745303 75.521902,55.3145391 71.08,57.88 L22.58,85.88 C18.136401,88.445513 11.6246902,89.2830057 7.18143731,86.7168927 C6.13717482,86.1137998 3.57213603,84.1869612 2.30939174,81.7030656 C1.01766723,79.1621642 0.794828125,77.4720313 0.794828125,74.8705673 C0.794828125,74.3234497 1.08871641,72.3501904 1.18089318,71.8114302 C1.87553233,67.7513627 4.82211343,63.7845166 8.2183217,59.1423897 L15.0742247,49.4506269 C15.7181371,48.5403918 16.8702889,48.1554024 17.9229071,48.4788724 L18.0973177,48.5393753 C22.7072983,50.321471 26.3515363,53.9657091 28.1336321,58.5756896 C28.6133245,59.8639707 29.7651229,60.7821238 31.1279177,60.9625767 C31.5502497,61.021893 31.9844449,61.01003 32.4044041,60.9317322 C33.595475,60.7039577 34.6892672,59.9186102 35.2088778,58.573317 C36.9909735,53.9633364 40.6352115,50.3190984 45.2451921,48.5370027 C48.4791156,47.2866155 48.4791156,42.7121441 45.2451921,41.461757 C40.6352115,39.6796612 36.9909735,36.0354232 35.2088778,31.4254426 C33.9584906,28.1911919 29.3840192,28.1911919 28.1336321,31.4254426 C26.401039,35.9073682 22.9083191,39.4764584 18.479228,41.3089577 L18.0973177,41.461757 C16.7465471,41.9840285 15.2132094,41.5940759 14.2760582,40.4899489 C5.45195167,30.0936439 1.039905,22.4106238 1.039905,17.44 C1.039905,11.5337885 2.93490037,7.16287707 6.72489112,4.3272656 C8.55138099,3.10015082 10.2289683,2.38389094 11.7576531,2.17848595 C16.5438364,1.53538021 20.3120203,3.70058096 22.58,5.01 Z M69.2101013,2.3463258 C70.3239064,5.22804909 72.6019134,7.50605614 75.4836367,8.61986132 C77.5054543,9.40250039 77.5054543,12.2628599 75.4836367,13.0423931 C72.6019134,14.1561983 70.3239064,16.4342054 69.2101013,19.3159286 C68.4305679,21.3377462 65.5702084,21.3377462 64.7875693,19.3159286 C63.6737642,16.4342054 61.3957572,14.1561983 58.514034,13.0423931 C56.495322,12.2628597 56.495322,9.40250025 58.514034,8.61986132 C61.3963837,7.50846273 63.6744918,5.22922676 64.7875693,2.3463258 C65.5702084,0.32761386 68.4305679,0.32761386 69.2101013,2.3463258 Z"/>
    </g>
  </g>

  <!-- 环绕光点 -->
  <g transform="translate(200,200)">
    <g class="anim orbit">
      <circle cx="0" cy="0" r="7" fill="#00FFFF"/>
    </g>
  </g>
</svg>
